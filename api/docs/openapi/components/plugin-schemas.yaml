MarketPlugin:
  type: object
  required: [id, code, name, description, sort, installed, userPluginId, enabled, config]
  properties:
    id:
      type: integer
      format: int64
      description: 平台插件目录ID，不是用户实例ID。
      example: 1
    code:
      type: string
      maxLength: 50
      description: 稳定且区分大小写的插件标识。
      example: quadrant-board
    name: { type: string, maxLength: 50, example: 画板 }
    description: { type: string, maxLength: 500, nullable: true, example: null }
    sort: { type: integer, description: 升序排列，同值按目录ID升序。, example: 1 }
    installed: { type: boolean, description: 禁用实例仍视为已安装。, example: false }
    userPluginId:
      type: integer
      format: int64
      nullable: true
      description: 当前用户的实例ID，未安装时显式null。
      example: null
    enabled:
      type: boolean
      nullable: true
      description: 已安装时为布尔值，未安装时显式null。
      example: null
    config:
      type: object
      additionalProperties: true
      nullable: true
      description: 当前用户的完整配置对象，未安装时显式null；不是JSON字符串。数值采用MySQL JSON原生精度，高精度值需作为对象中的字符串保存。
      example: null

ApiResponsePluginMarket:
  type: object
  required: [code, msg, data]
  properties:
    code: { type: integer, enum: [200], example: 200 }
    msg: { type: string, example: success }
    data:
      type: array
      items: { $ref: '#/MarketPlugin' }
