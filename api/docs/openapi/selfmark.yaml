openapi: 3.1.0
info:
  title: SelfMark API
  version: 0.0.1
  description: SelfMark 后端接口契约。每个接口完成后导入 Apifox 并按路径和 HTTP 方法匹配更新。
servers:
  - url: http://localhost:8080
paths:
  /api/auth/register:
    post:
      summary: 注册并登录
      operationId: register
      tags: [认证]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '200':
          description: 注册成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponseAuth' }
        '400':
          description: 参数缺失或格式错误
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponseBadRequest' }
              example: { code: 400, msg: mobile 不能为空, data: null }
        '409':
          description: 手机号已注册
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponseConflict' }
              example: { code: 409, msg: 手机号已注册, data: null }
  /api/auth/login:
    post:
      summary: 登录
      operationId: login
      tags: [认证]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponseAuth' }
        '400':
          description: 参数缺失或格式错误
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponseBadRequest' }
              example: { code: 400, msg: 手机号格式错误, data: null }
        '401':
          description: 手机号不存在或密码错误
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponseUnauthorized' }
              example: { code: 401, msg: 手机号或密码错误, data: null }
  /api/users/me:
    get:
      summary: 获取当前登录用户
      operationId: getCurrentUser
      tags: [认证]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: token 有效并返回当前用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponseUser' }
        '401':
          description: token 缺失、无效或过期
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponseUnauthorized' }
              example: { code: 401, msg: token 无效, data: null }
  /api/auth/logout:
    post:
      summary: 登出
      operationId: logout
      tags: [认证]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 登出成功，当前 token 的 jti 已加入 Redis 黑名单
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponseEmpty' }
        '401':
          description: token 缺失、无效、过期或已登出
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponseUnauthorized' }
              example: { code: 401, msg: token 已登出, data: null }
  /actuator/health:
    get:
      summary: Actuator 健康检查
      operationId: actuatorHealth
      tags: [基础设施]
      responses:
        '200':
          description: 服务可用
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: UP
  /api/health:
    get:
      summary: API 健康检查
      operationId: apiHealth
      tags: [基础设施]
      responses:
        '200':
          description: 服务可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseHealth'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRequest:
      type: object
      required: [mobile, password, username]
      properties:
        mobile:
          type: string
          pattern: '^1[3-9]\d{9}$'
          example: '13800138000'
        password:
          type: string
          format: password
          description: 最多 72 个 UTF-8 字节（bcrypt 限制）
        username: { type: string, maxLength: 50, example: 小明 }
    LoginRequest:
      type: object
      required: [mobile, password]
      properties:
        mobile:
          type: string
          pattern: '^1[3-9]\d{9}$'
          example: '13800138000'
        password:
          type: string
          format: password
          description: 最多 72 个 UTF-8 字节（bcrypt 限制）
    UserResponse:
      type: object
      required: [id, account, username]
      properties:
        id: { type: integer, format: int64 }
        account: { type: string, description: 登录账号，当前等于 mobile, example: '13800138000' }
        username: { type: string, description: 用户展示名, example: 小明 }
    AuthPayload:
      type: object
      required: [id, account, username, token]
      properties:
        id: { type: integer, format: int64 }
        account: { type: string, example: '13800138000' }
        username: { type: string, example: 小明 }
        token: { type: string }
    ApiResponseAuth:
      type: object
      required: [code, msg, data]
      properties:
        code: { type: integer, example: 200 }
        msg: { type: string, example: success }
        data: { $ref: '#/components/schemas/AuthPayload' }
    ApiResponseUser:
      type: object
      required: [code, msg, data]
      properties:
        code: { type: integer, example: 200 }
        msg: { type: string, example: success }
        data: { $ref: '#/components/schemas/UserResponse' }
    ApiResponseEmpty:
      type: object
      required: [code, msg, data]
      properties:
        code: { type: integer, example: 200 }
        msg: { type: string, example: success }
        data: { type: 'null' }
    ApiResponseError:
      type: object
      required: [code, msg, data]
      description: 错误响应基础结构；当前版本的 code 与实际 HTTP 状态码保持一致
      properties:
        code:
          type: integer
          minimum: 400
          maximum: 599
          description: 当前版本等于实际 HTTP 状态码；不是独立业务码
        msg: { type: string, description: 面向调用方的错误说明 }
        data: { type: 'null' }
    ApiResponseBadRequest:
      allOf:
        - $ref: '#/components/schemas/ApiResponseError'
        - type: object
          properties:
            code: { type: integer, enum: [400], example: 400 }
    ApiResponseUnauthorized:
      allOf:
        - $ref: '#/components/schemas/ApiResponseError'
        - type: object
          properties:
            code: { type: integer, enum: [401], example: 401 }
    ApiResponseConflict:
      allOf:
        - $ref: '#/components/schemas/ApiResponseError'
        - type: object
          properties:
            code: { type: integer, enum: [409], example: 409 }
    ApiResponseHealth:
      type: object
      required: [code, msg, data]
      properties:
        code:
          type: integer
          example: 200
        msg:
          type: string
          example: success
        data:
          type: object
          required: [status]
          properties:
            status:
              type: string
              example: UP
