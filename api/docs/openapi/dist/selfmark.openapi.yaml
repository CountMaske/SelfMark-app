openapi: 3.0.3
info:
  title: SelfMark API
  version: 0.0.1
  description: SelfMark 后端接口契约。模块源文件经 Redocly bundle 后交付 Apifox 和前端。
servers:
  - url: http://localhost:8080
tags:
  - name: 基础设施
    description: 服务存活与健康检查接口。
  - name: 认证
    description: 手机号注册登录、当前用户与 JWT 登出接口。
  - name: 插件市场
    description: 平台插件目录及当前用户安装状态。
paths:
  /actuator/health:
    get:
      summary: Actuator 健康检查
      operationId: actuatorHealth
      tags:
        - 基础设施
      security: []
      responses:
        '200':
          description: 服务可用
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    example: UP
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/health:
    get:
      summary: API 健康检查
      operationId: apiHealth
      tags:
        - 基础设施
      security: []
      responses:
        '200':
          description: 服务可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseHealth'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/auth/register:
    post:
      summary: 注册并登录
      operationId: register
      tags:
        - 认证
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAuth'
        '400':
          description: 参数缺失或格式错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseBadRequest'
              example:
                code: 400
                msg: mobile 不能为空
                data: null
        '409':
          description: 手机号已注册
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseConflict'
              example:
                code: 409
                msg: 手机号已注册
                data: null
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/auth/login:
    post:
      summary: 登录
      operationId: login
      tags:
        - 认证
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAuth'
        '400':
          description: 参数缺失或格式错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseBadRequest'
              example:
                code: 400
                msg: 手机号格式错误
                data: null
        '401':
          description: 手机号不存在或密码错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUnauthorized'
              example:
                code: 401
                msg: 手机号或密码错误
                data: null
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/auth/logout:
    post:
      summary: 登出
      description: Redis 黑名单不可用时请求失败，不降级到进程内存储。
      operationId: logout
      tags:
        - 认证
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 登出成功，当前 token 的 jti 已加入 Redis 黑名单
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseEmpty'
        '401':
          description: token 缺失、无效、过期或已登出
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUnauthorized'
              example:
                code: 401
                msg: token 已登出
                data: null
        '500':
          description: Redis 黑名单服务不可用或服务器内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseInternalServerError'
              example:
                code: 500
                msg: 服务器内部错误
                data: null
  /api/users/me:
    get:
      summary: 获取当前登录用户
      description: 鉴权时必须查询 Redis 黑名单；Redis 不可用时请求失败。
      operationId: getCurrentUser
      tags:
        - 认证
      security:
        - bearerAuth: []
      responses:
        '200':
          description: token 有效并返回当前用户
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUser'
        '401':
          description: token 缺失、无效、过期或已登出
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUnauthorized'
              example:
                code: 401
                msg: token 无效
                data: null
        '500':
          description: Redis 黑名单服务不可用或服务器内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseInternalServerError'
              example:
                code: 500
                msg: 服务器内部错误
                data: null
  /api/plugins:
    get:
      summary: 查询插件市场
      description: 返回全部平台插件及当前用户安装状态，按sort、目录ID升序；未安装插件的实例ID、enabled、config显式为null。用户身份来自JWT。
      operationId: listPluginMarket
      tags:
        - 插件市场
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 市场查询成功；空目录返回空数组。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePluginMarket'
              examples:
                uninstalled:
                  summary: 当前用户未安装插件
                  value:
                    code: 200
                    msg: success
                    data:
                      - id: 1
                        code: quadrant-board
                        name: 画板
                        description: null
                        sort: 1
                        installed: false
                        userPluginId: null
                        enabled: null
                        config: null
                      - id: 2
                        code: pomodoro
                        name: 番茄钟
                        description: null
                        sort: 2
                        installed: false
                        userPluginId: null
                        enabled: null
                        config: null
                disabled:
                  summary: 已安装但禁用的实例仍返回配置
                  value:
                    code: 200
                    msg: success
                    data:
                      - id: 1
                        code: quadrant-board
                        name: 画板
                        description: null
                        sort: 1
                        installed: false
                        userPluginId: null
                        enabled: null
                        config: null
                      - id: 2
                        code: pomodoro
                        name: 番茄钟
                        description: null
                        sort: 2
                        installed: true
                        userPluginId: 10
                        enabled: false
                        config:
                          label: 专注
        '401':
          description: token缺失、无效、过期或已登出。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUnauthorized'
              example:
                code: 401
                msg: 未登录
                data: null
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    MarketPlugin:
      type: object
      required:
        - id
        - code
        - name
        - description
        - sort
        - installed
        - userPluginId
        - enabled
        - config
      properties:
        id:
          type: integer
          format: int64
          description: 平台插件目录ID，不是用户实例ID。
          example: 1
        code:
          type: string
          maxLength: 50
          description: 稳定且区分大小写的插件标识。
          example: quadrant-board
        name:
          type: string
          maxLength: 50
          example: 画板
        description:
          type: string
          maxLength: 500
          nullable: true
          example: null
        sort:
          type: integer
          description: 升序排列，同值按目录ID升序。
          example: 1
        installed:
          type: boolean
          description: 禁用实例仍视为已安装。
          example: false
        userPluginId:
          type: integer
          format: int64
          nullable: true
          description: 当前用户的实例ID，未安装时显式null。
          example: null
        enabled:
          type: boolean
          nullable: true
          description: 已安装时为布尔值，未安装时显式null。
          example: null
        config:
          type: object
          additionalProperties: true
          nullable: true
          description: 当前用户的完整配置对象，未安装时显式null；不是JSON字符串。数值采用MySQL JSON原生精度，高精度值需作为对象中的字符串保存。
          example: null
    ApiResponsePluginMarket:
      type: object
      required:
        - code
        - msg
        - data
      properties:
        code:
          type: integer
          enum:
            - 200
          example: 200
        msg:
          type: string
          example: success
        data:
          type: array
          items:
            $ref: '#/components/schemas/MarketPlugin'
    ApiResponseEmpty:
      type: object
      required:
        - code
        - msg
        - data
      properties:
        code:
          type: integer
          enum:
            - 200
          example: 200
        msg:
          type: string
          example: success
        data:
          $ref: '#/components/schemas/NullableData'
    ApiResponseError:
      type: object
      required:
        - code
        - msg
        - data
      description: 错误响应基础结构；当前版本的 code 与实际 HTTP 状态码保持一致。
      properties:
        code:
          type: integer
          minimum: 400
          maximum: 599
          description: 当前版本等于实际 HTTP 状态码，不是独立业务码。
        msg:
          type: string
          description: 面向调用方的错误说明
        data:
          $ref: '#/components/schemas/NullableData'
    ApiResponseBadRequest:
      allOf:
        - $ref: '#/components/schemas/ApiResponseError'
        - type: object
          properties:
            code:
              type: integer
              enum:
                - 400
              example: 400
    ApiResponseUnauthorized:
      allOf:
        - $ref: '#/components/schemas/ApiResponseError'
        - type: object
          properties:
            code:
              type: integer
              enum:
                - 401
              example: 401
    ApiResponseConflict:
      allOf:
        - $ref: '#/components/schemas/ApiResponseError'
        - type: object
          properties:
            code:
              type: integer
              enum:
                - 409
              example: 409
    ApiResponseInternalServerError:
      allOf:
        - $ref: '#/components/schemas/ApiResponseError'
        - type: object
          properties:
            code:
              type: integer
              enum:
                - 500
              example: 500
    ApiResponseHealth:
      type: object
      required:
        - code
        - msg
        - data
      properties:
        code:
          type: integer
          enum:
            - 200
          example: 200
        msg:
          type: string
          example: success
        data:
          type: object
          required:
            - status
          properties:
            status:
              type: string
              example: UP
    RegisterRequest:
      type: object
      required:
        - mobile
        - password
        - username
      properties:
        mobile:
          type: string
          pattern: ^1[3-9]\d{9}$
          example: '13800138000'
        password:
          type: string
          format: password
          description: 最多 72 个 UTF-8 字节（bcrypt 限制）
        username:
          type: string
          maxLength: 50
          example: 小明
    LoginRequest:
      type: object
      required:
        - mobile
        - password
      properties:
        mobile:
          type: string
          pattern: ^1[3-9]\d{9}$
          example: '13800138000'
        password:
          type: string
          format: password
          description: 最多 72 个 UTF-8 字节（bcrypt 限制）
    UserResponse:
      type: object
      required:
        - id
        - mobile
        - username
      properties:
        id:
          type: integer
          format: int64
        mobile:
          type: string
          description: 登录手机号
          example: '13800138000'
        username:
          type: string
          description: 用户展示名
          example: 小明
    AuthPayload:
      type: object
      required:
        - id
        - mobile
        - username
        - token
      properties:
        id:
          type: integer
          format: int64
        mobile:
          type: string
          example: '13800138000'
        username:
          type: string
          example: 小明
        token:
          type: string
    ApiResponseAuth:
      type: object
      required:
        - code
        - msg
        - data
      properties:
        code:
          type: integer
          enum:
            - 200
          example: 200
        msg:
          type: string
          example: success
        data:
          $ref: '#/components/schemas/AuthPayload'
    ApiResponseUser:
      type: object
      required:
        - code
        - msg
        - data
      properties:
        code:
          type: integer
          enum:
            - 200
          example: 200
        msg:
          type: string
          example: success
        data:
          $ref: '#/components/schemas/UserResponse'
    NullableData:
      type: object
      nullable: true
      example: null
  responses:
    InternalServerError:
      description: 服务器内部错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponseInternalServerError'
          example:
            code: 500
            msg: 服务器内部错误
            data: null
